# =============================================================================
# sevo — Nginx configuration block
#
# INSTRUCTIONS:
#   1. SSH into your VPS
#   2. Find your existing Nginx site config:
#      sudo nano /etc/nginx/sites-available/sevo.co.in
#      (or wherever your existing server block is)
#   3. INSIDE the existing server { ... } block for sevo.co.in,
#      ADD the blocks below — do NOT replace anything else.
#   4. Test:  sudo nginx -t
#   5. Apply: sudo systemctl reload nginx
#
# ⚠ DO NOT create a new server {} block — add these location {} blocks
#   inside the EXISTING server block for sevo.co.in
# =============================================================================

    # ── sevo — START (do not modify lines above this) ────────────────────

    # 1. React static assets (JS/CSS chunks from Vite build)
    location /sevo/assets/ {
        alias /var/www/sevo/frontend_dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # 2. Media uploads (profile photos, etc.)
    location /sevo/media/ {
        alias /var/www/sevo/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Fixes: this block was missing the X-Content-Type-Options: nosniff
        # header already present on the /sevo/ block below. Without it,
        # combined with the (separately fixed) lack of server-side file-type
        # validation on proof-photo uploads, a browser could be tricked into
        # sniffing and executing a disguised .html/.svg "photo" served from
        # this app's own origin (stored XSS).
        add_header X-Content-Type-Options "nosniff";
    }

    # 3. Django collected static files (admin, etc.)
    location /sevo/static/ {
        alias /var/www/sevo/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. WebSocket connections (Django Channels / live locations)
    location /sevo/ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # 5. Django API (all /sevo/api/ requests → Daphne on port 8002)
    location /sevo/api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        client_max_body_size 50M;
    }

    # 6. React SPA — catch-all for frontend routing (MUST be last)
    location /sevo/ {
        alias /var/www/sevo/frontend_dist/;
        try_files $uri $uri/ /sevo/index.html;
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # Exact match for /sevo (without trailing slash) → redirect
    location = /sevo {
        return 301 /sevo/;
    }

    # ── sevo — END ───────────────────────────────────────────────────────
