<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Headlight beam glow -->
    <radialGradient id="headlightGlow" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Bike body gradient -->
    <linearGradient id="bikeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Chrome / Metallic accents -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- CalTrack Orange accent -->
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Soft drop shadow for bike -->
    <filter id="bikeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Headlight beam projecting forward (Upwards) -->
  <path d="M26 12 L16 0 L48 0 L38 12 Z" fill="url(#headlightGlow)"/>

  <!-- Main Bike Group with Shadow -->
  <g filter="url(#bikeShadow)">
    <!-- Front Wheel -->
    <rect x="29" y="4" width="6" height="14" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <rect x="30.5" y="6" width="3" height="10" rx="1.5" fill="#475569"/>

    <!-- Front Mudguard & Fork -->
    <path d="M28 12 C28 9, 36 9, 36 12 L35 18 L29 18 Z" fill="url(#bikeBody)"/>
    <path d="M25 15 L29 17 M39 15 L35 17" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>

    <!-- Handlebars with Grips and Mirrors -->
    <path d="M19 18 L29 20 L35 20 L45 18" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Left & Right Mirrors -->
    <circle cx="17" cy="17" r="2.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
    <circle cx="47" cy="17" r="2.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
    <!-- Grips -->
    <rect x="18" y="16.5" width="4" height="3" rx="1" fill="#f97316"/>
    <rect x="42" y="16.5" width="4" height="3" rx="1" fill="#f97316"/>

    <!-- Headlight unit -->
    <path d="M28 14 Q32 12 36 14 Q36 17 32 17 Q28 17 28 14 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Fuel Tank & Fairings -->
    <path d="M26 21 C24 25, 24 30, 26 33 L38 33 C40 30, 40 25, 38 21 Z" fill="url(#bikeBody)" stroke="#1d4ed8" stroke-width="0.8"/>
    <!-- Orange Racing Stripe on Tank -->
    <path d="M30 21 L34 21 L34 32 L30 32 Z" fill="url(#orangeAccent)"/>

    <!-- Rider Silhouette -->
    <!-- Arms -->
    <path d="M20 20 Q24 27 27 29" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M44 20 Q40 27 37 29" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Rider Jacket Body / Shoulders -->
    <ellipse cx="32" cy="30" rx="8.5" ry="6" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <!-- High-vis Safety Vest Stripes -->
    <path d="M26 27 L28 34 M38 27 L36 34" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rider Helmet with Visor -->
    <ellipse cx="32" cy="27" rx="5.5" ry="6" fill="#0f172a"/>
    <!-- Helmet Shell Accent (CalTrack Cyan/Blue) -->
    <path d="M28 25 Q32 22 36 25 Q36 28 32 29 Q28 28 28 25 Z" fill="#0284c7"/>
    <!-- Visor facing UP -->
    <path d="M28.5 24 Q32 22 35.5 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Rider Seat & Rear Frame -->
    <path d="M27 33 L37 33 L36 43 L28 43 Z" fill="#0f172a"/>

    <!-- CalTrack Technician Tool / Delivery Box on Rear -->
    <rect x="23" y="41" width="18" height="13" rx="2.5" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <!-- Box Lid / Handle -->
    <rect x="25" y="42" width="14" height="2" rx="0.5" fill="#2563eb"/>
    <!-- CalTrack Brand Badge on Box -->
    <rect x="27" y="46" width="10" height="5" rx="1" fill="#2563eb"/>
    <circle cx="32" cy="48.5" r="1.5" fill="#f97316"/>

    <!-- Exhaust Pipes (Chrome) -->
    <rect x="39" y="38" width="2.5" height="15" rx="1" fill="url(#metal)"/>

    <!-- Rear Wheel & Taillight -->
    <rect x="29" y="52" width="6" height="10" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Glowing Red Taillight -->
    <rect x="29" y="54" width="6" height="2" rx="1" fill="#ef4444" filter="drop-shadow(0 1px 2px #ef4444)"/>
  </g>
</svg>
