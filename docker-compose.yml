# ─── QuickTIMS — Database-only Docker Compose ────────────────────────────────
#
# WHAT THIS RUNS:
#   • db       — PostgreSQL 16 (replaces Supabase)
#   • redis    — Redis 7 (for Celery + Django Channels)
#
# WHAT YOU STILL RUN MANUALLY:
#   • Django backend  →  cd backend && daphne -b 0.0.0.0 -p 8000 quicktims.asgi:application
#   • Celery worker   →  cd backend && celery -A quicktims worker -l info
#   • Celery beat     →  cd backend && celery -A quicktims beat -l info
#   • Frontend        →  cd frontend && npm run dev
#
# USAGE:
#   Start:     docker compose up -d
#   Stop:      docker compose down
#   Reset DB:  docker compose down -v   (WARNING: deletes all data)
#   Logs:      docker compose logs -f db
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sevo_db
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-sevo}
      POSTGRES_USER: ${DB_USER:-sevo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sevo_pass}
    ports:
      - "${DB_PORT:-5435}:5432"                  # accessible at host port 5435 (avoids local Postgres port 5432 conflict)
    volumes:
      - sevo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sevo_user} -d ${DB_NAME:-sevo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sevo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"                  # accessible at localhost:6379
    volumes:
      - sevo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sevo_pgdata:
    driver: local
  sevo_redis:
    driver: local
